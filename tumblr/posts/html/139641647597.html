                                                                                          <div class="caption"><p>一直猜想《麦兜》2001电影版49:50中的场景是香港长洲东湾泳滩。我每年都会去长洲住住，今年特意在这个角度拍了一张PANO。留意照片最左边的确是篮球场，是后来才围起来的，小巷尽头左右两小店已经关几年了，但是基本维持原貌，楼梯是后来修的，猜想之前也是横着的（我多年前去时已如此）。 (at 长洲)</p> </div>
